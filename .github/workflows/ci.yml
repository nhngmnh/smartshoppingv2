name: CI - Build and Test

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build with Maven
      run: mvn clean install -DskipTests
      
    - name: Run tests
      run: mvn test
      
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: freshfridge-jar
        path: target/*.jar
        retention-days: 7

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Run Maven verify
      run: mvn verify -DskipTests
      
    - name: Check code style
      run: mvn checkstyle:check || echo "Checkstyle not configured"
      continue-on-error: true

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build, code-quality]  # Chỉ deploy khi CI pass
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    
    steps:
    - name: Trigger Render deployment
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        echo "🚀 Triggering Render deployment..."
        response=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_DEPLOY_HOOK")
        if [ $response -eq 200 ] || [ $response -eq 201 ]; then
          echo "✅ Deployment triggered successfully!"
        else
          echo "❌ Deployment failed with status code: $response"
          exit 1
        fi
        
    - name: Deployment notification
      if: success()
      run: |
        echo "🎉 Deployment started on Render"
        echo "Check status at: https://dashboard.render.com"
